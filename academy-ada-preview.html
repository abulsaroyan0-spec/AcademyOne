const status=document.getElementById('status'),map=document.getElementById('map'),jump=document.getElementById('jump');for(let i=0;i<data.checkpoints.length;i++){let o=document.createElement('option');o.value=i;o.textContent=data.checkpoints[i][0];jump.append(o)}jump.onchange=()=>{let a=data.checkpoints[Number(jump.value)];pos.set(a[1],1.65+data.height(a[2]),a[2]);yaw=Number(jump.value)===3?Math.PI:0;pitch=0;plan=false;map.textContent='Հատակագիծ';roof.forEach(o=>o.visible=true)};
function toggleMap(){plan=!plan;roof.forEach(o=>o.visible=!plan);map.textContent=plan?'Շարժվել':'Հատակագիծ';if(plan&&document.pointerLockElement)document.exitPointerLock()}
map.onclick=toggleMap;document.getElementById('reset').onclick=()=>{pos.set(4.75,1.65,.05);yaw=pitch=0};
renderer.domElement.onclick=()=>{if(!plan)renderer.domElement.requestPointerLock?.()};let dragging=false,lastX=0,lastY=0;renderer.domElement.onpointerdown=e=>{dragging=true;lastX=e.clientX;lastY=e.clientY};window.addEventListener('pointerup',()=>dragging=false);document.addEventListener('mousemove',e=>{if(plan)return;if(document.pointerLockElement===renderer.domElement||dragging){yaw-=e.movementX*.0022;pitch=Math.max(-1.1,Math.min(1.1,pitch-e.movementY*.0022))}});
window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys.add(k);if(k==='m'&&!e.repeat)toggleMap();if(k==='e'&&!e.repeat){let a=doors.filter(d=>Math.hypot(d.x-pos.x,d.z-pos.z)<1.8).sort((a,b)=>Math.hypot(a.x-pos.x,a.z-pos.z)-Math.hypot(b.x-pos.x,b.z-pos.z))[0];if(a)a.open=!a.open}});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
let last=performance.now();function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-last)/1000);last=now;for(let a of doors){a.angle=T.MathUtils.damp(a.angle,a.open?1.5:0,8,dt);a.leaf.rotation.y=-a.angle}if(!plan){yaw+=(Number(keys.has('arrowleft'))-Number(keys.has('arrowright')))*dt*1.8;pitch=Math.max(-1.1,Math.min(1.1,pitch+(Number(keys.has('arrowup'))-Number(keys.has('arrowdown')))*dt*1.3));let f=Number(keys.has('w'))-Number(keys.has('s')),s=Number(keys.has('d'))-Number(keys.has('a')),n=Math.hypot(f,s)||1,speed=(keys.has('shift')?4:2.1)*dt;let dx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*speed/n,dz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*speed/n;if(can(pos.x+dx,pos.z))pos.x+=dx;if(can(pos.x,pos.z+dz))pos.z+=dz;pos.y=T.MathUtils.damp(pos.y,1.65+data.height(pos.z),16,dt);camera.position.copy(pos);camera.rotation.set(pitch,yaw,0,'YXZ');renderer.render(scene,camera)}else{let aspect=innerWidth/innerHeight;view.left=-Math.max(10,10*aspect);view.right=-view.left;view.top=view.right/aspect;view.bottom=-view.top;view.updateProjectionMatrix();view.position.set(1.2,65,-7);view.up.set(0,0,-1);view.lookAt(1.2,0,-7);renderer.render(scene,view)}const near=doors.some(d=>Math.hypot(d.x-pos.x,d.z-pos.z)<1.8);status.textContent=(data.areas.find(a=>pos.x>=a.x0&&pos.x<=a.x1&&pos.z>=a.z0&&pos.z<=a.z1)?.title||'Preview')+(near?' · E: door':'')+' · '+pos.x.toFixed(1)+', '+pos.z.toFixed(1)}
requestAnimationFrame(frame);
</script></body></html>
